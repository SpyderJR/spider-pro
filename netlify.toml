[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # 22+ needed for the native WebSocket global — @supabase/supabase-js's realtime-js
  # dependency throws at client-construction time on Node 20 without it, which crashed
  # the whole bundled API function the moment SUPABASE_SERVICE_ROLE_KEY got configured
  # (supabaseAdmin.ts creates the client at module load, so every route broke, not just
  # the Supabase-touching ones).
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # The bundle is already fully self-contained (esbuild inlines every
  # dependency) — nothing under node_modules needs to ship separately.
  external_node_modules = []

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
